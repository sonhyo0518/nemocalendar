name: CI

on:
  pull_request:
  push:
    branches: [main, feat/0.2.3-quality-gate]

jobs:
  lint-build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: https://example.com
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ci.apps.googleusercontent.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build